<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/nova-viagem.css">
    <title>Cadastro de Viagem</title>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="navbar-container">
            <a href="#" class="logo">
                <img src="../../assets/icon-fofo.png" alt="Ícone UniRide" class="icone-logo">UniRide
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Voltar</a></li>
            </ul>
        </div>
    </nav>

    <!-- Formulário de Cadastro de Viagem -->
    <div class="form-container">

        <div class="campo">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo">
            <p id="erroTitulo" class="erro" style="display:none;"></p>
        </div>

        <div class="campo">
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao">
            <p id="erroDescricao" class="erro" style="display:none;"></p>
        </div>

        <div class="campo">
            <label for="pontoPartida">Endereço de partida:</label>
            <input type="text" id="pontoPartida" name="pontoPartida">
            <p id="erroPontoPartida" class="erro" style="display:none;"></p>
        </div>

        <div class="campo">
            <label for="pontoChegada">Endereço de chegada (Universidade):</label>
            <input type="text" id="pontoChegada" name="pontoChegada">
            <p id="erroPontoChegada" class="erro" style="display:none;"></p>
        </div>

        <div class="campo">
            <label for="tipoRecorrencia">Sua viagem será recorrente ou avulsa?</label>
            <select name="tipoRecorrencia" id="tipoRecorrencia">
                <option value="avulsa">Avulsa</option>
                <option value="recorrente">Recorrente</option>
            </select>
        </div>

        <!-- Data e hora — visível apenas para viagens avulsas -->
        <div class="campo" id="divDataHora">
            <label for="dataHora">Data e hora:</label>
            <input type="datetime-local" id="dataHora" name="dataHora">
            <p id="erroDataHora" class="erro" style="display:none;"></p>
        </div>

        <!-- Campos de recorrência — visíveis apenas quando recorrente -->
        <div id="camposRecorrencia" style="display:none;">
            <div class="campo">
                <label>Dias da semana:</label>
                <div class="checkboxes-dias">
                    <label><input type="checkbox" name="dias[]" value="1"> Segunda</label>
                    <label><input type="checkbox" name="dias[]" value="2"> Terça</label>
                    <label><input type="checkbox" name="dias[]" value="3"> Quarta</label>
                    <label><input type="checkbox" name="dias[]" value="4"> Quinta</label>
                    <label><input type="checkbox" name="dias[]" value="5"> Sexta</label>
                    <label><input type="checkbox" name="dias[]" value="6"> Sábado</label>
                    <label><input type="checkbox" name="dias[]" value="0"> Domingo</label>
                </div>
                <p id="erroDias" class="erro" style="display:none;"></p>
            </div>

            <div class="campo">
                <label for="hora">Horário:</label>
                <input type="time" id="hora" name="hora">
                <p id="erroHora" class="erro" style="display:none;"></p>
            </div>

            <div class="campo">
                <label for="data_inicio">Data de início:</label>
                <input type="date" id="data_inicio" name="data_inicio">
                <p id="erroDataInicio" class="erro" style="display:none;"></p>
            </div>
        </div>

        <!-- ── Seção motorista: aparece só quando o usuário é motorista ── -->
        <div id="OpMotorista" style="display:none;">

            <div class="campo">
                <label for="tipoCarona">Você é motorista ou passageiro neste grupo?</label>
                <select name="tipoCarona" id="tipoCarona">
                    <option value="passageiro">Passageiro (Solicitação — procuro motorista)</option>
                    <option value="motorista">Motorista (Oferta — procuro passageiros)</option>
                </select>
            </div>

            <!-- Campos que aparecem só quando seleciona "motorista" -->
            <div id="OpPrecoCapacidade" style="display:none;">

                <div class="campo">
                    <label for="veiculo_id">Veículo que será utilizado:</label>
                    <select id="veiculo_id" name="veiculo_id">
                        <option value="">Carregando veículos...</option>
                    </select>
                    <p class="campo-dica">
                        Ao selecionar um veículo, a capacidade será preenchida automaticamente.
                    </p>
                </div>

                <div class="campo">
                    <label for="capacidade">Capacidade máxima de passageiros:</label>
                    <input type="number" id="capacidade" name="capacidade" min="1">
                    <p id="erroCapacidade" class="erro" style="display:none;"></p>
                </div>

                <div class="campo">
                    <label for="preco">Preço total da viagem (R$):</label>
                    <input type="number" id="preco" name="preco" min="0" step="0.01">
                    <p id="erroPreco" class="erro" style="display:none;"></p>
                    <p class="campo-dica">*Esse preço será dividido igualmente entre o motorista e os passageiros.</p>
                </div>

            </div>
        </div>

        <div class="campo">
            <button type="button" id="enviar">Cadastrar grupo de viagem</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../javascript/novaViagem.js"></script>

</body>
</html>
