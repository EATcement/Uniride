<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/nova-viagem.css">
    <title>Cadastro de Viagem</title>
</head>
<body>
<!-- Navbar -->
     <nav>
    <div class="navbar-container">
      <a href="#" class="logo">UniRide</a>
      <ul class="nav-menu">
        <!-- <li><a href="../../perfilUsuario/html/perfil.html">Perfil de usuário</a></li>-->
        <li><a href="index.html">Voltar</a></li>
      </ul>
    </div>
  </nav>

  <!--Formulário de Cadastro de Viagem-->
    <div>
        <div>
            <label for="titulo">Titulo: </label>
            <input type="text" id="titulo" name="titulo">
            <p id="erroTitulo"       style="display: none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="descricao">Descrição: </label>
            <input type="text" id="descricao" name="descricao">
            <p id="erroDescricao"    style="display: none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="pontoPartida">Endereço de partida: </label>
            <input type="text" id="pontoPartida" name="pontoPartida">
            <p id="erroPontoPartida" style="display: none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="pontoChegada">Endereço de chegada (Universidade): </label>
            <input type="text" id="pontoChegada" name="pontoChegada">
            <p id="erroPontoChegada" style="display: none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="dataHora">Data e hora: </label>
            <input type="datetime-local" id="dataHora" name="dataHora">
            <p id="erroDataHora"     style="display: none; color: var(--color-accent-red);"></p>
        </div>

        
        <div id="OpMotorista" style='display: none;'>
            <label for="tipoCarona">Você é motorista ou passageiro?</label>
            <select name="tipoCarona" id="tipoCarona"> 
                <option value="passageiro">Passageiro</option>
                <option value="motorista">Motorista</option>
            </select>
        </div>
            
        <div id="OpPreco" style='display: none;'>
            <label for="preco">Preço total da viagem: </label>
            <input type="number" id="preco" name="preco">
            <div>
                <p id="erroPreco"        style="display: none; color: var(--color-accent-red);"></p>
            </div>

            <p id="textoOpPreco"> *Esse preço será dividido igualmente entre o motorista e os passageiros</p>
        </div>

        <div>
            <label for="tipoRecorrencia">Sua viagem será recorrente ou avulsa?</label>
            <select name="tipoRecorrencia" id="tipoRecorrencia">
                <option value="avulsa">Avulsa</option>
                <option value="recorrente">Recorrente</option>
            </select>
        </div>

        <div id="camposRecorrencia" style="display: none;">

            <div>
                <label for="camposRecorrencia">Selecione as informações abaixo referentes à recorrência da viagem:</label><br>
                <label>Dias da semana:</label>
                <input type="checkbox" name="dias[]" value="1"> Segunda<br>
                <input type="checkbox" name="dias[]" value="2"> Terça<br>
                <input type="checkbox" name="dias[]" value="3"> Quarta<br>
                <input type="checkbox" name="dias[]" value="4"> Quinta<br>
                <input type="checkbox" name="dias[]" value="5"> Sexta<br>
                <input type="checkbox" name="dias[]" value="6"> Sábado<br>
                <input type="checkbox" name="dias[]" value="0"> Domingo<br>
                <p id="erroDias" style="display: none; color: var(--color-accent-red);"></p>

            </div><br>
            
            <div>
                <label>Horário:</label>
                <input type="time" id="hora"><br>
                <p id="erroHora" style="display: none; color: var(--color-accent-red);"></p>

            </div><br>

            <div>
                <label>Data de início:</label>
                <input type="date" id="data_inicio"><br>
                <p id="erroDataInicio" style="display: none; color: var(--color-accent-red);"></p>
            </div>
        </div>

        <div>
            <button type="button" id="enviar">Cadastrar grupo de viagem</button>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../javascript/novaViagem.js"></script>

</body>
</html>
