<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRide – Painel Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<nav>
    <div class="navbar-container">
        <a href="#" class="logo">
            <img src="../assets/icon-fofo.png" alt="Ícone UniRide" class="icone-logo">
            UniRide
            <span class="badge-admin">Admin</span>
        </a>
        <ul class="nav-menu">
            <li>
                <span id="adminNome" style="color: #8d99ae; font-size: .9rem;"></span>
            </li>
            <li>
                <a href="../php/logout.php" class="btn-logout">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<div class="page-header">
    <h2>Usuários Cadastrados</h2>
    <p>Gerencie todos os usuários da plataforma UniRide.</p>
</div>

<div class="search-bar">
    <input type="text" id="buscarUsuario" placeholder="Buscar por nome ou e-mail…">
</div>

<div class="count-label" id="countLabel"></div>

<div class="table-wrapper">
    <div id="loadingMsg" class="loading">Carregando usuários…</div>

    <table id="tabelaUsuarios" style="display:none;">
        <thead>
            <tr>
                <th>Foto</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Nascimento</th>
                <th>Tipo</th>
                <th>Status</th>
                <th style="width: 60px;"></th> </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <div id="emptyState" class="empty-state" style="display:none;">
        Nenhum usuário encontrado.
    </div>
</div>

<div id="modalUsuario" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #1e2130; width: 90%; max-width: 600px; padding: 20px; border-radius: 8px; color: #fff; max-height: 80vh; overflow-y: auto;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0;">Caronas do Usuário</h3>
            <button onclick="fecharModal()" style="background: none; border: none; color: #E63946; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>

        <div id="loadingModal" style="text-align: center; color: #8d99ae;">Carregando...</div>

        <div id="conteudoModal" style="display: none;">
            <h4 style="color: #E63946; border-bottom: 1px solid #333; padding-bottom: 5px;">Caronas Criadas</h4>
            <div id="listaCriadas" style="margin-bottom: 20px;"></div>

            <h4 style="color: #E63946; border-bottom: 1px solid #333; padding-bottom: 5px;">Participa como Passageiro</h4>
            <div id="listaPassageiro" style="margin-bottom: 20px;"></div>

            <h4 style="color: #E63946; border-bottom: 1px solid #333; padding-bottom: 5px;">Participa como Motorista</h4>
            <div id="listaMotorista"></div>
        </div>

    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
