<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRide – Painel Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<nav>
    <div class="navbar-container">
        <a href="#" class="logo">
            <img src="../assets/icon-fofo.png" alt="Ícone UniRide" class="icone-logo">
            UniRide
            <span class="badge-admin">Admin</span>
        </a>
        <ul class="nav-menu">
            <li>
                <span id="adminNome" style="color: #8d99ae; font-size: .9rem;"></span>
            </li>
            <li>
                <a href="../php/logout.php" class="btn-logout">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<div class="page-header">
    <h2>Usuários Cadastrados</h2>
    <p>Gerencie todos os usuários da plataforma UniRide.</p>
</div>

<div class="search-bar">
    <input type="text" id="buscarUsuario" placeholder="Buscar por nome ou e-mail…">
</div>

<div class="count-label" id="countLabel"></div>

<div class="table-wrapper">
    <div id="loadingMsg" class="loading">Carregando usuários…</div>

    <table id="tabelaUsuarios" style="display:none;">
        <thead>
            <tr>
                <th>Foto</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Nascimento</th>
                <th>Tipo</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <div id="emptyState" class="empty-state" style="display:none;">
        Nenhum usuário encontrado.
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
