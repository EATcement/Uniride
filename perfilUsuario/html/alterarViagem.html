<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/alterar-viagem.css">
    <title>Editar Grupo de Viagem</title>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="navbar-container">
            <a href="#" class="logo">
                <img src="../../assets/icon-fofo.png" alt="Ícone UniRide" class="icone-logo">UniRide
            </a>
            <ul class="nav-menu">
                <li><a href="../../viagens/html/index.html">Voltar</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">

        <!-- Badge que exibe o papel do usuário no grupo -->
        <p id="badgePapel" style="display:none; background:#1e2d3b; color:#3498db;
            padding:8px 14px; border-radius:6px; font-size:0.9rem; margin-bottom:16px;
            border-left:4px solid #3498db;"></p>

        <!--Essa parte só edita criador do grupo, apenas visivel para motorista que entrou no grupo depois -->
        <section id="secaoBasica">
            <h2 class="secao-titulo">Informações do grupo</h2>

            <div class="campo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo">
                <p id="erroTitulo" class="erro" style="display:none; color: var(--color-accent-red);"></p>
            </div>

            <div class="campo">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" name="descricao">
                <p id="erroDescricao" class="erro" style="display:none; color: var(--color-accent-red);"></p>
            </div>

            <div class="campo">
                <label for="pontoPartida">Endereço de partida:</label>
                <input type="text" id="pontoPartida" name="pontoPartida">
                <p id="erroPontoPartida" class="erro" style="display:none; color: var(--color-accent-red);"></p>
            </div>

            <div class="campo">
                <label for="pontoChegada">Endereço de chegada (Universidade):</label>
                <input type="text" id="pontoChegada" name="pontoChegada">
                <p id="erroPontoChegada" class="erro" style="display:none; color: var(--color-accent-red);"></p>
            </div>

           

            <div class="campo">
                <label for="tipoRecorrencia">Recorrência da viagem:</label>
                <select name="tipoRecorrencia" id="tipoRecorrencia">
                    <option value="avulsa">Avulsa</option>
                    <option value="recorrente">Recorrente</option>
                </select>
            </div>

            <div class="campo" id="divDataHora">
                <label for="dataHora">Data e hora:</label>
                <input type="datetime-local" id="dataHora" name="dataHora">
                <p id="erroDataHora" class="erro" style="display:none; color: var(--color-accent-red);"></p>
            </div>

            <div id="camposRecorrencia" style="display:none;">
                <div class="campo">
                    <label>Dias da semana:</label>
                    <div class="checkboxes-dias">
                        <label><input type="checkbox" name="dias[]" value="1"> Segunda</label>
                        <label><input type="checkbox" name="dias[]" value="2"> Terça</label>
                        <label><input type="checkbox" name="dias[]" value="3"> Quarta</label>
                        <label><input type="checkbox" name="dias[]" value="4"> Quinta</label>
                        <label><input type="checkbox" name="dias[]" value="5"> Sexta</label>
                        <label><input type="checkbox" name="dias[]" value="6"> Sábado</label>
                        <label><input type="checkbox" name="dias[]" value="0"> Domingo</label>
                    </div>
                    <p id="erroDias" class="erro" style="display:none; color: var(--color-accent-red);"></p>
                </div>

                <div class="campo">
                    <label for="hora">Horário:</label>
                    <input type="time" id="hora" name="hora">
                    <p id="erroHora" class="erro" style="display:none; color: var(--color-accent-red);"></p>
                </div>

                <div class="campo">
                    <label for="data_inicio">Data de início:</label>
                    <input type="date" id="data_inicio" name="data_inicio">
                    <p id="erroDataInicio" class="erro" style="display:none; color: var(--color-accent-red);"></p>
                </div>
            </div>
        </section>

        <!-- Aqui é preço e capacidade visivel apenas para motoristas-->
        <section id="secaoPrecoCapacidade" style="display:none;">
            <h2 class="secao-titulo">Veículo e valores</h2>

            <div class="campo">
                <label for="veiculo_id">Veículo que será utilizado:</label>
                <select id="veiculo_id" name="veiculo_id">
                    <option value="">Carregando veículos...</option>
                </select>
            </div>

            <div class="campo">
                <label for="capacidade">Capacidade máxima de passageiros:</label>
                <input type="number" id="capacidade" name="capacidade" min="1">
                <p id="erroCapacidade" class="erro" style="display:none; color: var(--color-accent-red);"></p>
            </div>

            <div class="campo">
                <label for="preco">Preço total da viagem (R$):</label>
                <input type="number" id="preco" name="preco" min="0" step="0.01">
                <p class="campo-dica">
                    *Esse preço será dividido igualmente entre o motorista e os passageiros.
                </p>
            </div>
        </section>

        <!-- Botões de ação -->
        <div class="campo acoes">
            <a href="../html/perfil.html" id="cancelar" class="btn-cancelar">Cancelar</a>
            <button type="button" id="enviar" class="btn-salvar">Salvar alterações</button>
        </div>

    </div><!-- /form-container -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../javascript/validaSessaoUsuario.js"></script>
    <script src="../javascript/alterarViagem.js"></script>

</body>
</html>
