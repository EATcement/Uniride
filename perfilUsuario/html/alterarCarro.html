<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/alterar-carro.css">
    <title>Alteração de Veículo</title>
</head>
<body>
    <nav>
        <div class="navbar-container">
            <a href="#" class="logo"><img src="../../assets/icon-fofo.png" alt="Ícone UniRide" class="icone-logo">UniRide</a>
            <ul class="nav-menu">
                <li><a href="../../viagens/html/index-viagem.html">Voltar</a></li>
            </ul>
        </div>
    </nav>
    <div>
        <div>
            <label for="placa">Placa: </label>
            <input type="text" id="placa" name="placa">
            <p id="erroPlaca" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="marca">Marca: </label>
            <input type="text" id="marca" name="marca">
            <p id="erroMarca" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="modelo">Modelo: </label>
            <input type="text" id="modelo" name="modelo">
            <p id="erroModelo" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="ano">Ano: </label>
            <input type="number" id="ano" name="ano">
            <p id="erroAno" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="cor">Cor: </label>
            <input type="text" id="cor" name="cor">
            <p id="erroCor" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="renavam">RENAVAM: </label>
            <input type="text" id="renavam" name="renavam">
            <p id="erroRenavam" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="capacidade">Capacidade de passageiros: </label>
            <input type="number" id="capacidade" name="capacidade">
            <p id="erroCapacidade" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="gastoCombustivel">Gasto de combustível (km/l): </label>
            <input type="number" step="0.1" id="gastoCombustivel" name="gastoCombustivel">
            <p id="erroGastoCombustivel" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <label for="categoria">Categoria: </label>
            <input type="text" id="categoria" name="categoria">
            <p id="erroCategoria" class="erro" style="display:none; color: var(--color-accent-red);"></p>
        </div>

        <div>
            <a href="perfil.html" id="cancelar">Cancelar</a>
            <button type="button" id="enviar">Cadastrar veiculo</button>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../javascript/alterarCarro.js"></script>

</body>
</html>
